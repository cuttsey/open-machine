name: Incident Tracker

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Allow manual triggers for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-incidents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Scan for new incidents
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scan_incidents.py

      - name: Create pull request
        if: steps.scan.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/incident-update
          delete-branch: true
          title: "Update incident inventory with new findings"
          body: |
            ## Automated Incident Scan

            This PR was generated by the daily incident tracker workflow using
            Claude with web search. It contains new AI agent misconduct incidents
            found since the last update.

            **Please review all new entries before merging:**
            - Are sources credible and links valid?
            - Are descriptions factual and neutral?
            - Are categories and severity ratings appropriate?
            - Are there any duplicates of existing entries?
          commit-message: "Update incident inventory with new findings"
          committer: "Incident Tracker <incident-tracker[bot]@users.noreply.github.com>"
          labels: incident-update
